name: CI

on:
   push:
      branches: [master]
   pull_request:

jobs:
   storefront:
      runs-on: ubuntu-latest
      defaults:
         run:
            working-directory: apps/storefront
      steps:
         - uses: actions/checkout@v4
         - uses: oven-sh/setup-bun@v2
         - run: bun install --frozen-lockfile
         - run: bun run typecheck
